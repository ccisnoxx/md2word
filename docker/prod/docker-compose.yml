# docker/prod/docker-compose.yml: P0 生产环境编排，运行配置统一来自仓库根目录 .env。
name: md2word-p0

services:
  api:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    image: ${MD2WORD_IMAGE:?必须设置同一版本的 API/Worker 镜像引用}
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips=127.0.0.1",
      ]
    env_file:
      - ../../.env
    ports:
      - "${MD2WORD_API_BIND_HOST:-127.0.0.1}:${MD2WORD_API_BIND_PORT:-18000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - md2word-var:/app/var
      - ../../deploy/auth_internal_users.json:/app/deploy/auth_internal_users.json:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3).read()",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: ${MD2WORD_IMAGE:?必须设置同一版本的 API/Worker 镜像引用}
    command: ["python", "scripts/dev/run_document_worker.py"]
    env_file:
      - ../../.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - md2word-var:/app/var
      - ../../deploy/auth_internal_users.json:/app/deploy/auth_internal_users.json:ro
    restart: unless-stopped

  redis:
    image: docker.io/library/redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - md2word-redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mysql:
    image: docker.io/library/mysql@sha256:c36050afdca850f23cef85703f84c7531a5ae155a11b5ee1c60acb09937c4084
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${JOBS_MYSQL_DATABASE:-md2word}
      MYSQL_USER: ${JOBS_MYSQL_USER:-md2word}
      MYSQL_PASSWORD: ${JOBS_MYSQL_PASSWORD:?JOBS_MYSQL_PASSWORD is required}
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    volumes:
      - md2word-mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  md2word-var:
  md2word-redis:
  md2word-mysql:
