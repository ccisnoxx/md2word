# 已弃用：当前 `mineru_to_docx.py` 主流程不会读取本文件。
# 保留它仅用于兼容旧实验记录；当前内置版式配置入口是 `resources/template_configs/datasheet_template_v2.yaml`。
# 如果后续恢复本文件接线，应先同步更新 `.codestable/architecture/ARCHITECTURE.md`。
#
# 文件：md2word_tool/resources/template_configs/md2docx.yaml

# 基础配置
output: output                    # 输出目录
template: resources/templates/default/datasheet_template.docx  # Word 模板路径
enable_toc: false                 # 是否生成目录

# 表格配置
table:
  style: Table Grid               # 表格样式
  font_size: 9                    # 字号
  font_name: null                 # 字体名称（null 使用模板默认）
  vertical_align: center          # 垂直对齐: top | center | bottom

image:
  default_width_percent: 35
  max_width_inch: 6.0
  max_height_inch: 4.0
  max_size_mb: 10

heading:
  mode: mineru
  max_level: 6

toc:
  depth: 3

# 调试配置
debug:
  verbose: false                  # 详细日志
  stats: false                    # 显示性能统计
  no_cleanup: false              # 不清理临时文件
