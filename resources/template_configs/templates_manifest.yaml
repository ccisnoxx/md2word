# 此清单绑定仓库内置默认模板的 DOCX 与版式 YAML。
# 同目录 datasheet_template.yaml 仅供已发布的 default@1 历史版本读取，保留原字节。
templates:
  - id: default
    name: datasheet_template
    description: 当前默认 DOCX 模板与绑定页面布局配置。
    enabled: true
    is_default_seed: true
    version: 2
    template_path: resources/templates/default/datasheet_template.docx
    layout_config_path: resources/template_configs/datasheet_template_v2.yaml
