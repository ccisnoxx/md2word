# =========================================================
# 6. Projects 信任策略
# =========================================================
# 推荐原则：
# - 新项目先设为 untrusted
# - 常驻开发、你明确了解的项目再升 trusted
# - 项目级 trust_level 比“全局想当然信任”更重要

[projects."/Users/sc/PycharmProjects/md2word"]
trust_level = "trusted"

[projects."/Users/sc/Documents/Codex/2026-06-02/users-sc-bak-vps-txt-wg"]
trust_level = "trusted"

[projects."/Users/sc/PycharmProjects/PythonProject/md2word_main"]
trust_level = "trusted"

[projects."/Users/sc/Documents/Codex/2026-06-04/files-mentioned-by-the-user-txt"]
trust_level = "trusted"

[projects."/Users/sc/Documents/Codex/2026-06-05/pve-pve-ros-ip-172-16"]
trust_level = "trusted"

[projects."/Users/sc/Documents/Codex/2026-06-05/pve-pve-ros-ip-172-16-2"]
trust_level = "trusted"


# 你可以继续按这个模式添加：
# [projects."/absolute/path/to/repo"]
# trust_level = "trusted"

# =========================================================
# 7. Plugins 精简启用策略
# =========================================================
# 原则：只开你真会用的
# 对“偏编程”场景，不必把文档/表格/演示全常开

# 文档类：只有你经常生成 Word / Docs 时再开
[plugins."documents@openai-primary-runtime"]
enabled = true

# 表格类：只有你经常处理 Excel / CSV / 报表时再开
[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

# 演示类：只有你经常做 PPT / Slides 时再开
[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[tui]
# resume/fork 会话列表更紧凑，长会话多时更好扫。
session_picker_view = "dense"

# 长会话终端 resize 时少回放历史行，降低 TUI 卡顿概率。
terminal_resize_reflow_max_rows = 3000

[tui.model_availability_nux]
