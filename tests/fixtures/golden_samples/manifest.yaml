# tests/fixtures/golden_samples/manifest.yaml: 维护 P0 PDF 到 Word Golden Sample 样本清单和验收标签。
schema_version: 1
sample_root: tests/fixtures/golden_samples/pdfs
target_success_rate: 1.0
default_mode: direct_pdf_to_word
default_document_language: zh
default_template_version_id:
samples:
  - id: gs-003
    filename: OPA228_P1.pdf
    title: OPA228 双栏数据手册首页
    source_status: available
    document_language: en
    tags: [en, double_column, datasheet, paragraph_order, headings, figures, table]
    acceptance_focus:
      - 双栏阅读顺序正确，Features/Applications/Description 不左右栏交错
      - 标题层级和项目符号列表基本保留
      - 噪声曲线图和 Device Information 表格相对位置可追溯
  - id: gs-004
    filename: OPA228_P2.pdf
    title: OPA228 目录与修订历史
    source_status: available
    document_language: en
    tags: [en, datasheet, table_of_contents, revision_history, double_column, lists]
    acceptance_focus:
      - 双栏目录条目和页码顺序可追溯
      - Revision History 项目符号列表顺序保留
      - 页眉、页脚和正文边界不互相覆盖
  - id: gs-006
    filename: OPA228_P6.pdf
    title: OPA228 热阻信息表
    source_status: available
    document_language: en
    tags: [en, datasheet, thermal_table, parameter_table, symbols, wide_table]
    acceptance_focus:
      - 多张 Thermal Information 表行列稳定
      - θ/ψ、°C/W、封装和 pin 数等符号可读
      - 表格脚注靠近对应表格且正文顺序正确
  - id: gs-008
    filename: OPA228_P7.pdf
    title: OPA228 电气特性宽表
    source_status: available
    document_language: en
    tags: [en, datasheet, wide_table, electrical_characteristics, parameter_table, symbols]
    acceptance_focus:
      - Electrical Characteristics 宽表列名、单位和分组保留
      - VOS、PSRR、CMRR、nV/√Hz、µV/°C 等上下标和特殊符号可读
      - 表格内容可编辑且不大面积挤压或错列
