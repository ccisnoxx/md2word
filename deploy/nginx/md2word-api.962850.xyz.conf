# deploy/nginx/md2word-api.962850.xyz.conf: hostdzire 上 md2word API 的 nginx 站点配置。

upstream md2word_api_backend {
    server 127.0.0.1:18000;
    keepalive 64;
}

server {
    listen 10.0.0.2:80 proxy_protocol;
    server_name md2word-api.962850.xyz;

    access_log /var/log/nginx/md2word-api.962850.xyz.access.log main;
    error_log /var/log/nginx/md2word-api.962850.xyz.error.log warn;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 10.0.0.2:443 ssl proxy_protocol;
    http2 on;
    server_name md2word-api.962850.xyz;

    access_log /var/log/nginx/md2word-api.962850.xyz.access.log main;
    error_log /var/log/nginx/md2word-api.962850.xyz.error.log warn;

    include /etc/nginx/snippets/cert-962850.xyz.conf;
    include /etc/nginx/snippets/ssl-common.conf;

    client_max_body_size 64m;

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/proxy-buffer-streaming.conf;
        include /etc/nginx/snippets/proxy-timeout-api-long.conf;
        include /etc/nginx/snippets/cors-open.conf;

        proxy_set_header Connection "";
        proxy_next_upstream off;
        proxy_pass http://md2word_api_backend;
    }
}
