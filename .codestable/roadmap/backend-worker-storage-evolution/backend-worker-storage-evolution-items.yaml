roadmap: backend-worker-storage-evolution
created: 2026-05-28

items:
  - slug: stage-dispatcher-port
    description: 抽出后台 stage 调度 port，让 router / lifecycle 通过 dispatcher 触发执行，当前实现仍使用 BackgroundTasks 和 JobStageService.dispatch_message
    depends_on: []
    status: done
    feature: 2026-05-28-stage-dispatcher-port
    minimal_loop: true
    notes: 已抽出 StageDispatcherProtocol；当前 InProcessStageDispatcher 仍委托 JobStageService.dispatch_message / replay_pending，现有 jobs 主链行为不变。

  - slug: stage-message-store-contract
    description: 将 stage message 能力从大 repository 依赖里进一步拆出，固定 replayable message 语义和失败消息处理规则
    depends_on: [stage-dispatcher-port]
    status: planned
    feature: null
    minimal_loop: false
    notes: 必须保持 pending/running 可 replay，failed 不自动 replay

  - slug: repository-boundary-split
    description: 把 job snapshot、events、files、stage messages 的协议拆成更窄的 application 依赖，FileJobRepository 继续作为组合实现
    depends_on: [stage-message-store-contract]
    status: planned
    feature: null
    minimal_loop: false
    notes: 不改当前 JSON 物理存储格式

  - slug: artifact-storage-local-adapter
    description: 在现有 JobArtifactService 合同上抽出 local artifact storage adapter，保留当前 file_type、alias 和 download 行为
    depends_on: [repository-boundary-split]
    status: planned
    feature: null
    minimal_loop: false
    notes: 暂不接 OSS / S3，只把 local file 边界固定下来

  - slug: worker-process-readiness-design
    description: 补充 worker / storage adapter 模式的 readiness 字段、runbook 和诊断口径，为未来独立 worker 做前置说明
    depends_on: [stage-message-store-contract]
    status: planned
    feature: null
    minimal_loop: false
    notes: 只做当前单实例可观测性，不实现跨进程心跳

  - slug: storage-backend-migration-plan
    description: 设计从 local file 到数据库 / 对象存储的迁移顺序、兼容字段和回滚策略
    depends_on: [artifact-storage-local-adapter, worker-process-readiness-design]
    status: planned
    feature: null
    minimal_loop: false
    notes: 规划型 feature，不直接迁移生产数据
