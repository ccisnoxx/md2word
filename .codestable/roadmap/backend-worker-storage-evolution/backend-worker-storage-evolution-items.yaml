roadmap: backend-worker-storage-evolution
created: 2026-05-28

items:
  - slug: stage-dispatcher-port
    description: 抽出后台 stage 调度 port，让 router / lifecycle 通过 dispatcher 触发执行，当前实现仍使用 BackgroundTasks 和 JobStageService.dispatch_message
    depends_on: []
    status: done
    feature: 2026-05-28-stage-dispatcher-port
    minimal_loop: true
    notes: 已抽出 StageDispatcherProtocol；当前 InProcessStageDispatcher 仍委托 JobStageService.dispatch_message / replay_pending，现有 jobs 主链行为不变。

  - slug: stage-message-store-contract
    description: 将 stage message 能力从大 repository 依赖里进一步拆出，固定 replayable message 语义和失败消息处理规则
    depends_on: [stage-dispatcher-port]
    status: done
    feature: 2026-05-28-stage-message-store-contract
    minimal_loop: false
    notes: 已定义 StageMessageStoreProtocol；业务调度入口改走 stage_message_store，FileJobRepository 继续实现 file-backed store；pending/running 可 replay，failed 不自动 replay。

  - slug: repository-boundary-split
    description: 把 job snapshot、events、files、stage messages 的协议拆成更窄的 application 依赖，FileJobRepository 继续作为组合实现
    depends_on: [stage-message-store-contract]
    status: done
    feature: 2026-05-28-repository-boundary-split
    minimal_loop: false
    notes: 已拆出 JobSnapshotRepositoryProtocol、JobEventRepositoryProtocol、JobFileRepositoryProtocol 和 StageMessageStoreProtocol；FileJobRepository 继续作为组合实现，不改 JSON 物理格式。

  - slug: artifact-storage-local-adapter
    description: 在现有 JobArtifactService 合同上抽出 local artifact storage adapter，保留当前 file_type、alias 和 download 行为
    depends_on: [repository-boundary-split]
    status: done
    feature: 2026-05-28-artifact-storage-local-adapter
    minimal_loop: false
    notes: 已新增 LocalArtifactStorageAdapter；artifact 注册和本地下载路径解析改走 artifact_storage，JobArtifactService 保留 file_type、alias、media、URL 和 filename 合同语义。

  - slug: worker-process-readiness-design
    description: 补充 worker / storage adapter 模式的 readiness 字段、runbook 和诊断口径，为未来独立 worker 做前置说明
    depends_on: [stage-message-store-contract]
    status: done
    feature: 2026-05-28-worker-process-readiness-design
    minimal_loop: false
    notes: 已在 readiness 暴露 worker_mode、stage_dispatcher、stage_message_store、artifact_storage，以及 pending/running/failed stage spool 计数；failed 只作为诊断信号，不自动恢复。

  - slug: storage-backend-migration-plan
    description: 设计从 local file 到数据库 / 对象存储的迁移顺序、兼容字段和回滚策略
    depends_on: [artifact-storage-local-adapter, worker-process-readiness-design]
    status: done
    feature: 2026-05-28-storage-backend-migration-plan
    minimal_loop: false
    notes: 已完成 local file 校验、database metadata adapter/shadow copy/switch、artifact 下载合同、local_object shadow upload/switch；worker/queue 独立评估结论为继续单体单实例，未来需要多实例时另起 roadmap。
