    feature: null
    minimal_loop: false
    notes: "从 Phase 6 移到后续 controlled rollout/release evidence 阶段；真实 execution pilot 选定后再按实际能力建项。"

  - slug: phase6-release-gate-runbook
    description: 把真实集成 smoke、fake/local parity、OpenAPI、frontend build、rollback 和 kill-switch 检查纳入 release gate/runbook
    depends_on:
