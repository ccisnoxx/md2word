    feature: null
    minimal_loop: false
    notes: "完成证据：.trellis/tasks/archive/2026-06/06-07-phase6-quota-enforcement-ops-hardening/；current ready-state upload blocking 和 Admin override 已接受为内部 enforcement，本条完成 ops hardening、rollback visibility 和 audit replay。"

  - slug: real-integration-audit-replay
