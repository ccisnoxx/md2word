  - slug: cleanup-scheduler-controlled-execute
    description: 把 manual scheduler dry-run 推进到 disabled-by-default 自动 execute loop，复用 lock/history/signed plan/delete contract
    depends_on: [real-s3-delete-guarded-execution]
    status: dropped
    feature: null
    minimal_loop: false
    notes: "从 Phase 6 移到 Phase 7+ / controlled rollout；必须排在 guarded real S3 delete 之后，不能成为第一个真实破坏性执行入口。"

  - slug: quota-enforcement-ops-hardening
    description: 为 quota block/admin override 增加 Admin UI、audit details 展示、配置 readiness、runbook 和 rollback 验证
    depends_on: [integration-control-plane]
