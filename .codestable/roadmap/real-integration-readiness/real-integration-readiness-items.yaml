      - real-provider-cancellation-adapter
      - real-s3-delete-guarded-execution
      - cleanup-scheduler-controlled-execute
      - real-integration-audit-replay
    status: dropped
    feature: null
    minimal_loop: false
    notes: "Phase 6 closeout 已用 focused tests、OpenAPI currentness、frontend build 和 git diff --check 验收 foundation；真实上线 release gate/runbook 移到 Phase 7 / controlled rollout。"

