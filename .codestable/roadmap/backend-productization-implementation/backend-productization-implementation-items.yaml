roadmap: backend-productization-implementation
created: 2026-05-28

items:
  - slug: mysql-metadata-foundation
    description: 建立 MySQL 业务 metadata 基线，使现有 job 主链可在 MySQL metadata store 下跑通
    depends_on: []
    status: done
    feature: 2026-05-28-mysql-metadata-foundation
    minimal_loop: true
    notes: 不改变 PDF、DOCX、MinerU zip 等大文件继续存本地文件系统的边界

  - slug: local-artifact-contract-hardening
    description: 加固本地 artifact 合同，补齐 hash、大小、retention、下载诊断和缺失文件错误
    depends_on: [mysql-metadata-foundation]
    status: done
    feature: 2026-05-28-local-artifact-contract-hardening
    minimal_loop: false
    notes: 继续使用 local_file，不引入 S3、OSS、MinIO

  - slug: resource-versioning-foundation
    description: 建立资源版本通用协议，统一 draft、published、disabled、superseded、默认指针和不可变发布版本规则
    depends_on: [mysql-metadata-foundation]
    status: done
    feature: 2026-05-28-resource-versioning-foundation
    minimal_loop: false
    notes: 后续 Template Profile、Term Rule Set、Translation Profile 共用

  - slug: template-profile-versioning
    description: 实现 Template Profile 版本管理，支持上传 docx、layout、render_policy、发布和设默认
    depends_on: [resource-versioning-foundation, local-artifact-contract-hardening]
    status: done
    feature: 2026-05-29-template-profile-versioning
    minimal_loop: false
    notes: Template Profile 只包含 docx、layout、render_policy，不包含术语规则和翻译配置

  - slug: term-rule-set-versioning
    description: 实现术语规则草稿、发布、回滚和默认版本查询，任务只读取发布版本
    depends_on: [resource-versioning-foundation]
    status: done
    feature: 2026-05-29-term-rule-set-versioning
    minimal_loop: false
    notes: 已发布版本不可原地修改，回滚只切默认发布版本指针

  - slug: translation-profile-and-segment-trace
    description: 建立 Translation Profile 与 segment 追踪，保存 AI 初译和最终渲染文本，为人工校对预留
    depends_on: [resource-versioning-foundation]
    status: done
    feature: 2026-05-29-translation-profile-and-segment-trace
    minimal_loop: false
    notes: MVP 不做人工校对 UI，只预留数据结构和接口边界

  - slug: job-resource-snapshot-binding
    description: 任务创建时解析模板、术语、翻译配置发布版本，并写入不可变资源快照
    depends_on: [template-profile-versioning, term-rule-set-versioning, translation-profile-and-segment-trace]
    status: done
    feature: 2026-05-29-job-resource-snapshot-binding
    minimal_loop: false
    notes: job 快照不随默认模板、默认术语或默认翻译配置变更而变化

  - slug: permission-and-audit-baseline
    description: 建立最小 actor、role 和 audit event，保护发布、回滚、retry、cleanup 和下载等高风险动作
    depends_on: [resource-versioning-foundation, job-resource-snapshot-binding]
    status: done
    feature: 2026-05-29-permission-and-audit-baseline
    minimal_loop: false
    notes: 不做多租户，不接复杂 SSO；先保证 service 层有 actor 和审计事件

  - slug: operations-readiness-and-test-baseline
    description: 补齐部署说明、MySQL migration、readiness、metrics、结构化日志、状态机测试和真实链路 smoke
    depends_on: [mysql-metadata-foundation, job-resource-snapshot-binding, permission-and-audit-baseline]
    status: done
    feature: 2026-05-29-operations-readiness-and-test-baseline
    minimal_loop: false
    notes: 目标是单实例生产化，不引入外部监控平台作为前置条件
