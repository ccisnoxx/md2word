feature: 2026-05-28-storage-backend-migration-plan
created: 2026-05-28

steps:
  - action: "固化迁移前校验：定义 local file 数据完整性检查，覆盖 job snapshot、events、files、stage messages 和 artifact 文件存在性"
    exit_signal: "只读检查能报告总数、缺失项和不可迁移项，不写任何数据"
    status: done

  - action: "实现 database metadata adapter：让数据库 adapter 实现现有 job snapshot、events、files 和 stage message store protocols"
    exit_signal: "同一组 jobs service 测试可在 file/database 两种 adapter 下通过"
    status: done

  - action: "实现 metadata shadow copy 离线复制与校验：从 local file metadata 复制到 database，并校验 job snapshot、events、files、stage messages 一致"
    exit_signal: "重复执行 shadow copy 目标 database 稳定，不产生重复 events/files/stage messages；默认 runtime 不切换"
    status: done

  - action: "实现 metadata backend switch：完成配置切换和 readiness 观测"
    exit_signal: "切换到 database 后 jobs 查询、retry、callback、replay 行为不变"
    status: done

  - action: "扩展 artifact storage 下载合同：把 local-only 路径解析演进为可表达 local path 或 stream/redirect 的下载结果合同"
    exit_signal: "local adapter 行为不变，对象存储 adapter 可插入"
    status: done

  - action: "实现 artifact shadow upload 和切换：上传对象、回填 object_key、保留 local fallback，并切换下载 adapter"
    exit_signal: "source_pdf、parsed_result_package、result_docx 都能通过统一下载入口取回"
    status: done

  - action: "独立评估 worker / queue：在 DB/object storage 稳定后单独决定是否引入独立 worker、heartbeat、抢占锁和队列"
    exit_signal: "有单独 worker roadmap 或明确决定继续单实例"
    status: done

checks:
  - item: "迁移顺序保持先 metadata、后 artifact、最后 worker/queue，不做大爆炸切换"
    source: 编排骨架
    status: passed

  - item: "JobFile.path 继续保持 job 内逻辑路径，不变成绝对路径、object key 或 public URL"
    source: 名词契约
    status: passed

  - item: "events 继续作为审计轨迹复制，不用于 event sourcing 或重建 job snapshot"
    source: 范围守护
    status: passed

  - item: "metadata shadow copy 和 artifact shadow upload 都可重复执行，且不会产生重复记录"
    source: 流程级约束
    status: passed

  - item: "readiness 能准确显示 effective_repository_backend、stage_message_store 和 artifact_storage 当前模式"
    source: 验收场景
    status: passed

  - item: "每个切换阶段都有保留旧数据的回滚窗口，不在校验通过前删除 local file 数据"
    source: 回滚策略
    status: passed

  - item: "本阶段不选择具体 DB/S3 厂商，不引入独立 worker；迁移动作只保留离线 shadow copy/upload 能力"
    source: 明确不做
    status: passed
