# .codestable/features/2026-06-03-golden-sample-live-regression-scale-up/golden-sample-live-regression-scale-up-checklist.yaml: golden-sample-live-regression-scale-up 执行和验收清单。
feature: 2026-06-03-golden-sample-live-regression-scale-up
roadmap: pdf-to-word-delivery-hardening
roadmap_item: golden-sample-live-regression-scale-up

steps:
  - id: environment-gate-review
    status: done
    description: 复核真实回归环境、账号/Token、API、Worker、MinerU 配置和当前 4 个正式 PDF 与 manifest 对齐状态
    exit_signal: 能说明 gs-003/004/006/008 每个样本将在哪个环境执行，或明确记录缺少哪个前置条件

  - id: live-regression-run
    status: done
    description: 运行 Golden Sample 真实回归脚本，保留 run_dir、report.json、report.md 和下载的 DOCX
    exit_signal: 4 个正式样本均有 succeeded/failed/未执行原因，且报告不泄露凭证

  - id: manual-quality-records
    status: done
    description: 对成功样本打开 DOCX 并记录可打开、可编辑性、标题/列表、表格、图片/figure、双栏或宽表顺序
    exit_signal: 每个成功样本都有人工质量结论，且不把主链路通过等同于 P0 质量通过

  - id: failure-classification
    status: done
    description: 汇总真实链路失败、IR/layout 风险、renderer/editable 风险、样本扩容缺口和环境阻塞
    exit_signal: 每个失败或质量不通过项都能路由到 environment、sample-sourcing、document-ir-layout-risk-pass 或 word-renderer-editable-output-pass

  - id: docs-and-roadmap-backfill
    status: done
    description: 回填 Golden Sample 验收报告、roadmap notes 和 feature acceptance 输入
    exit_signal: 下一条 design 可直接读取最新回归结果、人工结论和分类表作为输入

checks:
  - id: four-runnable-samples-accounted
    status: passed
    description: gs-003/004/006/008 均被真实回归尝试执行，或逐样本记录未执行阻塞原因

  - id: report-current-status
    status: passed
    description: Golden Sample 验收报告反映 4 个正式样本最新执行状态，而不是只停留在 1/1 smoke

  - id: manual-quality-not-overclaimed
    status: passed
    description: 成功样本均有人工质量记录，且不把 DOCX 可打开声明为 P0 版面与语义质量通过

  - id: classification-routes-next-features
    status: passed
    description: 分类表明确哪些问题进入 document-ir-layout-risk-pass、哪些进入 word-renderer-editable-output-pass、哪些属于环境或样本缺口

  - id: no-business-code-change
    status: passed
    description: 本 feature 不修改 DocumentIR、renderer、前端、后端 API 或部署配置

  - id: no-secret-leakage
    status: passed
    description: 回归执行和文档落档不写入凭证、token、客户文件正文或完整解析文本
