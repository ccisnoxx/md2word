feature: 2026-05-28-resource-versioning-foundation
created: 2026-05-28

steps:
  - action: "名词合同先落地：新增资源版本状态、记录和解析模型"
    exit_signal: "模型能表达 draft / published / disabled / superseded 和 published-only 解析结果"
    status: done

  - action: "持久化协议接通：新增 repository protocol、MySQL 默认指针表和资源版本读写方法"
    exit_signal: "fake MySQL 下可保存、读取、列出版本，并切换默认指针"
    status: done

  - action: "状态机服务落地：实现草稿更新、发布、设默认、回滚、禁用、supersede 和解析规则"
    exit_signal: "单测覆盖 published 不可变、默认只能指向 published、默认版本不能禁用"
    status: done

  - action: "runtime 最小接入：MySQL backend 下构建 ResourceVersionService，file / sqlite 默认路径保持不变"
    exit_signal: "build_runtime 在 fake MySQL 下可拿到 resource version service"
    status: done

  - action: "验证与回写：运行资源版本与数据库 adapter 针对性测试，校验 checklist"
    exit_signal: "测试通过，steps 标记 done"
    status: done

checks:
  - item: "不新增资源版本 HTTP router"
    source: 范围守护
    status: passed

  - item: "不改变现有 templates / term-rules API 行为"
    source: 范围守护
    status: passed

  - item: "资源版本 payload 不写入 jobs payload 或 artifact 文件记录"
    source: 范围守护
    status: passed

  - item: "published / disabled / superseded 版本不能通过 draft 写入路径改 payload、hash 或 payload_ref"
    source: 流程级约束
    status: passed

  - item: "默认指针只能指向 published 版本"
    source: 流程级约束
    status: passed

  - item: "disable / supersede 默认版本前必须先切走默认指针"
    source: 流程级约束
    status: passed

  - item: "rollback 只切默认指针，不修改旧版本内容"
    source: 验收场景
    status: passed
