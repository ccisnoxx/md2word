# .codestable/features/2026-06-03-word-renderer-editable-output-pass/word-renderer-editable-output-pass-checklist.yaml: word-renderer-editable-output-pass 执行和验收清单。
feature: 2026-06-03-word-renderer-editable-output-pass
roadmap: pdf-to-word-delivery-hardening
roadmap_item: word-renderer-editable-output-pass

steps:
  - id: renderer-parity-mapping
    status: done
    description: 对照 failure classification、manual records 和 legacy runtime，落 heading/list/formula/caption/table 的 renderer 策略映射证据
    exit_signal: 每类策略都有“直接迁移 / 局部迁移 / 暂不迁移”的理由，且只选 DocumentIR 当前字段可驱动的稳定策略

  - id: text-semantic-pass
    status: done
    description: 补 heading named style、真实 list numbering、formula normalization 和 rich text 输出语义
    exit_signal: DocumentIR renderer 回归能检查 w:pStyle、w:numPr、w:vertAlign 与常见 LaTeX 残留清理

  - id: table-semantic-pass
    status: done
    description: 补 caption-before-table、TableNote、TableContent 与 header/cell editable style 语义
    exit_signal: 表格回归能检查 caption 在 table 前、note 在 table 后、caption keep_with_next，且表格仍保留 rowspan/colspan

  - id: document-jobs-ooxml-regression
    status: done
    description: 用 document_jobs / DocumentIR renderer 近似 fixture 生成 Word artifact 并检查 OOXML 语义
    exit_signal: 覆盖 gs-004 heading + numbering、gs-006 caption-before-table + formula clean、gs-008 wide table/table style + formula clean 的近似场景

  - id: docs-and-roadmap-backfill
    status: done
    description: acceptance 后同步 architecture / requirement / roadmap，记录 renderer editable output 已接入范围和剩余 Golden Sample blocked 项
    exit_signal: 当前实现边界写清楚，且不把剩余样本规模、人工质量或视觉版面问题误标为通过

checks:
  - id: design-approved
    status: passed
    description: design frontmatter 为 approved，roadmap item 已回写 in-progress 并绑定当前 feature

  - id: scope-guardrails-kept
    status: passed
    description: 未改前端、未扩 API、未改 Golden Sample manifest，未把 TOC leader、完整 landscape 版面或 10-20 样本扩容算入通过条件

  - id: renderer-semantics-compatible
    status: passed
    description: heading/list/formula/caption/table 语义只使用 DocumentIR 当前字段和可选模板配置；旧模板缺字段时 fallback 稳定

  - id: heading-and-list-ooxml
    status: passed
    description: heading 输出真实 Word named style 或配置 style；list 输出 w:numPr，且可见文本不依赖手写项目符号前缀

  - id: formula-rich-text-clean
    status: passed
    description: formula block 或含 TeX 的 table cell 清理常见 LaTeX 残留，并在可表达时用 w:vertAlign 表示上下标

  - id: table-annotations-ordered
    status: passed
    description: table caption 在 table XML 前，table note / footnote 在 table XML 后，caption 设置 keep_with_next，表格仍是可编辑 Word table

  - id: document-jobs-regression-covered
    status: passed
    description: document_jobs eager worker 或 execution service 回归生成 Word artifact，并通过 OOXML 语义断言

  - id: mounting-points-contained
    status: passed
    description: 新挂载点只限 renderer 语义写入、可选模板配置、OOXML 回归和 CodeStable 状态回写，不引入 legacy runtime 作为线上第二渲染入口

  - id: no-secret-leakage
    status: passed
    description: 新增 evidence、测试和文档不写入凭证、token、客户文件正文或完整解析文本
